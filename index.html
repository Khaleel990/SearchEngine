<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Dark Home Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: radial-gradient(circle at top, #1f2937 0, #020617 50%, #000000 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #e5e7eb;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1.5rem 2rem 0.75rem;
      text-align: center;
    }

    .center-container {
      display: none;
    }

    h1 {
      font-size: 3rem;
      letter-spacing: 0.05em;
      color: #f9fafb;
      text-shadow: 0 0 18px rgba(59, 130, 246, 0.45);
    }

    header::after {
      content: '';
      display: block;
      width: 180px;
      height: 2px;
      margin: 0.75rem auto 0;
      background: linear-gradient(90deg, transparent, #38bdf8, #a855f7, transparent);
      opacity: 0.7;
    }

    .button-wrapper {
      text-align: center;
      letter-spacing: 0.05em;
    }

    .panel-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .panel {
      background: rgba(15, 23, 42, 0.98);
      padding: 1.5rem 2rem;
      border-radius: 0.9rem;
      width: 320px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.95);
    }

    .panel h2 {
      margin-bottom: 1rem;
      font-size: 1.25rem;
    }

    .panel-group {
      margin-bottom: 0.75rem;
    }

    .panel label {
      display: block;
      margin-bottom: 0.25rem;
      font-size: 0.85rem;
      opacity: 0.9;
      color: #9ca3af;
    }

    .panel input {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border-radius: 0.5rem;
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: rgba(15, 23, 42, 0.85);
      color: #e5e7eb;
      outline: none;
    }

    .panel input:focus,
    .panel select:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.7);
    }

    .panel select {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border-radius: 0.5rem;
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: rgba(15, 23, 42, 0.85);
      color: #e5e7eb;
      outline: none;
      cursor: pointer;
    }

    .panel .section-new-input {
      margin-top: 0.5rem;
      display: none;
    }

    .panel .section-new-input.show {
      display: block;
    }

    .panel-actions {
      margin-top: 1rem;
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
    }

    .links-container {
      flex: 1;
      padding: 1.5rem 2.5rem 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      align-items: center;
      overflow-y: auto;
    }

    .section {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .section.dragging {
      opacity: 0.5;
    }

    .section.drag-over {
      border-top: 2px solid rgba(94, 234, 212, 0.8);
      padding-top: 0.5rem;
    }

    .section.reordering {
      cursor: move;
      border: 1px dashed rgba(94, 234, 212, 0.4);
      border-radius: 0.5rem;
      padding: 0.5rem;
    }

    .section-title {
      font-size: 1.25rem;
      color: #9ca3af;
      font-weight: 500;
      margin-bottom: 0.5rem;
      text-align: center;
      cursor: inherit;
    }

    .section.reordering .section-title {
      cursor: move;
    }

    .panel-sections-list {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(148, 163, 184, 0.2);
    }

    .panel-sections-list h3 {
      font-size: 0.9rem;
      color: #9ca3af;
      margin-bottom: 0.75rem;
      font-weight: 500;
    }

    .section-list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0.75rem;
      margin-bottom: 0.5rem;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 0.5rem;
      border: 1px solid rgba(148, 163, 184, 0.2);
    }

    .section-list-item-name {
      flex: 1;
      color: #e5e7eb;
      font-size: 0.85rem;
    }

    .section-list-delete-btn {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 0.25rem 0.5rem;
      border-radius: 0.375rem;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.15s ease;
      min-width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .section-list-delete-btn:hover {
      background: rgba(239, 68, 68, 0.3);
      border-color: rgba(239, 68, 68, 0.6);
      color: #fee2e2;
    }

    .section-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      align-items: center;
      align-content: center;
      text-align: center;
    }
    .section-buttons button {
  display: inline-flex;       /* already set */
  align-items: center;
  gap: 0.5rem;
  padding: 0.5rem 1rem;      /* optional: smaller padding if needed */
  width: auto;               /* 🔥 make width fit content */
  min-width: 0;              /* remove minimum width constraint */
}


    button {
      padding: 0.7rem 2.4rem;
      font-size: 0.95rem;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      cursor: pointer;
      color: #e5e7eb;
      background: radial-gradient(circle at top left, #1d283a, #020617);
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.85);
      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        background 0.15s ease,
        border-color 0.15s ease,
        color 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.95);
      background: radial-gradient(circle at top left, #2563eb, #0f172a);
      border-color: rgba(96, 165, 250, 0.8);
      color: #f9fafb;
    }

    button:active {
      transform: translateY(0);
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.9);
      background: radial-gradient(circle at bottom right, #1d4ed8, #020617);
    }

    .link-icon {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      background: rgba(15, 23, 42, 0.9);
      object-fit: contain;
    }

    .delete-mode-btn {
      background: radial-gradient(circle at top left, #7f1d1d, #450a0a);
      position: fixed;
      right: 1.5rem;
      bottom: 1.5rem;
      z-index: 20;
      padding-inline: 1.75rem;
    }

    .delete-mode-btn.active {
      background: radial-gradient(circle at top left, #b91c1c, #7f1d1d);
      box-shadow: 0 0 0 1px rgba(248, 113, 113, 0.7), 0 10px 26px rgba(15, 23, 42, 0.9);
    }

    .reorder-mode-btn {
      background: radial-gradient(circle at top left, #0f766e, #064e3b);
      position: fixed;
      left: 1.5rem;
      bottom: 1.5rem;
      z-index: 20;
      padding-inline: 1.75rem;
    }

    .reorder-mode-btn.active {
      background: radial-gradient(circle at top left, #14b8a6, #0f766e);
      box-shadow: 0 0 0 1px rgba(45, 212, 191, 0.7), 0 10px 26px rgba(15, 23, 42, 0.9);
    }

    .reorder-icon {
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
    }

    .link-button.reordering {
      border-style: dashed;
      border-color: rgba(94, 234, 212, 0.8);
      background: radial-gradient(circle at top left, #022c22, #020617);
    }

   
   .open-panel-btn.circular {
  width: 28px;
  height: 28px;
  position: fixed;
  top: 1.5rem;
  right: 1.5rem;

  padding: 0;              /* 🔥 important: remove padding */
  border-radius: 50%;

  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.open-panel-btn.circular .plus-icon {
  width: 16px;
  height: 16px;
  font-size: 1rem;
  line-height: 1;
}
.circular {
  width: 28px;
  height: 28px;
  padding: 0;
  border-radius: 50%;

  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.circular .plus-icon,
.circular .minus-icon,
.circular .reorder-icon {
  width: 16px;
  height: 16px;
  font-size: 1rem;
  line-height: 1;
}

    .plus-icon,
    .minus-icon {
      width: 20px;
      height: 20px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.95);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }
    .delete-mode-btn.circular,
    .reorder-mode-btn.circular {
      padding: 0 !important;   /* kill padding-inline */
      width: 28px;
      height: 28px;
      border-radius: 50%;

      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .open-panel-btn.linked {
      border-color: #22c55e !important;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.5) !important;
    }

    .toast-msg {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(56, 189, 248, 0.7);
      color: #38bdf8;
      padding: 0.5rem 1.25rem;
      border-radius: 999px;
      font-size: 0.85rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .toast-msg.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }


  </style>
</head>
<body>
  <header>
    <h1>My Work Page</h1>
  </header>

  <main class="center-container">
    <div class="button-wrapper">
    </div>
  </main>

  <section class="links-container" id="links-container">
    <!-- New buttons will appear here -->
  </section>

  <div class="panel-backdrop" id="panel-backdrop">
    <div class="panel" role="dialog" aria-modal="true">
      <h2>Add Website Button</h2>

      <div class="panel-group">

        </select>
        <input type="text" id="section-new-input" class="section-new-input" placeholder="New section name..." />

      </div>

        <h3>Manage Sections</h3>
        <div id="sections-list-container"></div>
      </div>
      <div class="panel-sections-list">
        <h3>Local File Auto-Save</h3>
        <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 0.5rem; gap: 0.5rem;">
          <span id="file-link-status" style="font-size: 0.8rem; color: #9ca3af;">Auto-Save: Off</span>

      <div class="panel-actions">
        <button type="button" id="cancel-panel-btn">Cancel</button>

    </div>
  </div>

  <button type="button" id="open-panel-btn" class="open-panel-btn circular" title="Add Website Button">
    <span class="plus-icon">+</span>
  </button>
  <button type="button" id="link-file-btn" class="open-panel-btn circular" style="right: 3.75rem;" title="Link data.json for automatic saving">
    <span id="link-icon" style="font-size: 0.85rem;">🔗</span>
  </button>
  <button type="button" id="quick-export-btn" class="open-panel-btn circular" style="right: 6rem;" title="Download Backup (data.json)">
    <span style="font-size: 0.85rem;">💾</span>
  </button>
  <button type="button" id="quick-import-btn" class="open-panel-btn circular" style="right: 8.25rem;" title="Import Backup JSON">
    <span style="font-size: 0.85rem;">📂</span>
  </button>

  <button type="button" id="delete-mode-btn" class="delete-mode-btn circular" title="Delete Mode">
    <span class="minus-icon">-</span>
  </button>

  <button type="button" id="reorder-mode-btn" class="reorder-mode-btn circular" title="Reorder Buttons">
    <span class="reorder-icon">⇅</span>
  </button>
  <button type="button" id="reorder-section-btn" class="reorder-mode-btn circular" style="left: 4rem;" title="Reorder Sections">
    <span class="reorder-icon">≡</span>
  </button>
<div class="panel-backdrop" id="reorder-section-panel" style="display: none;">
  <div class="panel" role="dialog" aria-modal="true">
    <h2>Reorder Section</h2>
    <div class="panel-group">
      <label for="reorder-section-select">Choose Section</label>
      <select id="reorder-section-select">
        <option value="">Select a section...</option>
      </select>
    </div>
    <div class="panel-group">
      <label for="reorder-section-index">New Position (0 = first)</label>
      <input type="number" id="reorder-section-index" min="0" placeholder="Enter new position" />
    </div>
    <div class="panel-actions">
      <button type="button" id="cancel-reorder-section-btn">Cancel</button>
      <button type="button" id="apply-reorder-section-btn">Apply</button>
    </div>
  </div>
</div>

  <script>
    const openPanelBtn = document.getElementById('open-panel-btn');
    const deleteModeBtn = document.getElementById('delete-mode-btn');
    const reorderModeBtn = document.getElementById('reorder-mode-btn');
    const panelBackdrop = document.getElementById('panel-backdrop');
    const cancelPanelBtn = document.getElementById('cancel-panel-btn');
    const createSiteBtn = document.getElementById('create-site-btn');
    const siteDomainInput = document.getElementById('site-domain');
    const siteSectionSelect = document.getElementById('site-section');
    const sectionNewInput = document.getElementById('section-new-input');
    const newSectionBtn = document.getElementById('new-section-btn');
    const linksContainer = document.getElementById('links-container');
    const exportBackupBtn = document.getElementById('export-backup-btn');
    const importBackupBtn = document.getElementById('import-backup-btn');
    const importFileInput = document.getElementById('import-file-input');
    const quickExportBtn = document.getElementById('quick-export-btn');
    const quickImportBtn = document.getElementById('quick-import-btn');
    const linkFileBtn = document.getElementById('link-file-btn');
    const panelLinkFileBtn = document.getElementById('panel-link-file-btn');
    const fileLinkStatus = document.getElementById('file-link-status');
    const linkIcon = document.getElementById('link-icon');

    let deleteMode = false;
    let reorderMode = false;
    let dragSourceId = null;
    let dragSectionId = null;
    let sites = [];
    let sections = [];
    let fileHandle = null;
    let autoSaveTimer = null;

    // Toast Notification helper
    let toastTimeout = null;
    function showToast(msg) {
      const toast = document.getElementById('toast-msg');
      if (!toast) return;
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    // IndexedDB for persisting data.json FileSystemFileHandle
    const IDB_NAME = 'SearchEngineStorage';
    const IDB_STORE = 'handles';

    function openIDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function storeFileHandle(handle) {
      try {
        const db = await openIDB();
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put(handle, 'dataJson');
      } catch (e) {
        console.warn('Could not persist file handle', e);
      }
    }

    async function getStoredFileHandle() {
      try {
        const db = await openIDB();
        return new Promise((resolve) => {
          const tx = db.transaction(IDB_STORE, 'readonly');
          const req = tx.objectStore(IDB_STORE).get('dataJson');
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      } catch (e) {
        return null;
      }
    }

    function updateFileLinkUI(isLinked) {
      if (isLinked) {
        if (linkFileBtn) {
          linkFileBtn.classList.add('linked');
          linkFileBtn.title = 'Linked to data.json (Auto-saving active)';
        }
        if (linkIcon) linkIcon.textContent = '🟢';
        if (fileLinkStatus) {
          fileLinkStatus.textContent = 'Auto-Save: 🟢 Active';
          fileLinkStatus.style.color = '#4ade80';
        }
      } else {
        if (linkFileBtn) {
          linkFileBtn.classList.remove('linked');
          linkFileBtn.title = 'Click to link data.json for automatic saving';
        }
        if (linkIcon) linkIcon.textContent = '🔗';
        if (fileLinkStatus) {
          fileLinkStatus.textContent = 'Auto-Save: Off (click Link)';
          fileLinkStatus.style.color = '#9ca3af';
        }
      }
    }

    async function saveToFileHandle() {
      if (!fileHandle) return;
      try {
        const query = await fileHandle.queryPermission({ mode: 'readwrite' });
        if (query !== 'granted') {
          const req = await fileHandle.requestPermission({ mode: 'readwrite' });
          if (req !== 'granted') {
            updateFileLinkUI(false);
            return;
          }
        }
        const writable = await fileHandle.createWritable();
        const payload = JSON.stringify({ sections, sites }, null, 2);
        await writable.write(payload);
        await writable.close();
        updateFileLinkUI(true);
        showToast('✓ Auto-saved to ' + (fileHandle.name || 'data.json'));
      } catch (err) {
        console.warn('Could not write to linked file:', err);
      }
    }

    function scheduleFileAutoSave() {
      if (!fileHandle) return;
      clearTimeout(autoSaveTimer);
      autoSaveTimer = setTimeout(() => {
        saveToFileHandle();
      }, 350);
    }

    async function linkDataFile() {
      if (!window.showOpenFilePicker) {
        alert('Direct file auto-saving is supported on Chrome, Edge, and Chromium browsers. On other browsers, use the Export JSON button to download data.json.');
        return;
      }
      try {
        const [handle] = await window.showOpenFilePicker({
          types: [{
            description: 'JSON file',
            accept: { 'application/json': ['.json'] }
          }],
          multiple: false
        });
        if (!handle) return;
        fileHandle = handle;
        await storeFileHandle(handle);
        updateFileLinkUI(true);
        await saveToFileHandle();
        showToast('🔗 Linked to ' + handle.name + '! Auto-save is active.');
      } catch (err) {
        if (err.name !== 'AbortError') {
          console.warn('Error selecting file:', err);
        }
      }
    }

    async function onLinkButtonClick() {
      if (fileHandle) {
        try {
          const perm = await fileHandle.requestPermission({ mode: 'readwrite' });
          if (perm === 'granted') {
            updateFileLinkUI(true);
            await saveToFileHandle();
            showToast('✓ Auto-save active for ' + fileHandle.name);
            return;
          }
        } catch(e) {}
      }
      await linkDataFile();
    }

    const DEFAULT_SECTIONS = [
      { id: "section-code-ai", name: "Code-Ai", order: 0 },
      { id: "section-game-store", name: "Game-Store", order: 1 },
      { id: "section-my-boards", name: "My_Boards", order: 2 },
      { id: "section-developement", name: "Developement", order: 3 },
      { id: "section-designing", name: "Designing", order: 4 },
      { id: "section-social-apps", name: "Social Apps", order: 5 }
    ];

    const DEFAULT_SITES = [
      { id: "site-chatgpt", name: "Chatgpt", domain: "chatgpt.com", url: "https://chatgpt.com", faviconUrl: "https://www.google.com/s2/favicons?domain=chatgpt.com&sz=32", sectionId: "section-code-ai" },
      { id: "site-gemini", name: "Gemini", domain: "gemini.google.com", url: "https://gemini.google.com", faviconUrl: "https://www.google.com/s2/favicons?domain=gemini.google.com&sz=32", sectionId: "section-code-ai" },
      { id: "site-copilot", name: "Copilot", domain: "copilot.microsoft.com", url: "https://copilot.microsoft.com", faviconUrl: "https://www.google.com/s2/favicons?domain=copilot.microsoft.com&sz=32", sectionId: "section-code-ai" },
      { id: "site-grok", name: "Grok", domain: "grok.com", url: "https://grok.com", faviconUrl: "https://www.google.com/s2/favicons?domain=grok.com&sz=32", sectionId: "section-code-ai" },
      { id: "site-chat", name: "Chat", domain: "chat.deepseek.com", url: "https://chat.deepseek.com", faviconUrl: "https://www.google.com/s2/favicons?domain=chat.deepseek.com&sz=32", sectionId: "section-code-ai" },

    function saveSites() {
      try {
        localStorage.setItem('myfiles_saved_sites', JSON.stringify(sites));
        scheduleFileAutoSave();
      } catch (e) {
        console.warn('Could not save sites', e);
      }
    }

    function saveSections() {
      try {
        localStorage.setItem('myfiles_saved_sections', JSON.stringify(sections));
        scheduleFileAutoSave();
      } catch (e) {
        console.warn('Could not save sections', e);
      }
    }

    function loadSites() {
      try {
        const raw = localStorage.getItem('myfiles_saved_sites');
        if (!raw) return DEFAULT_SITES;
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed) && parsed.length > 0) {
          return parsed;
        }
      } catch (e) {
        console.warn('Could not load sites', e);
      }
      return DEFAULT_SITES;
    }

    function loadSections() {
      try {
        const raw = localStorage.getItem('myfiles_saved_sections');
        if (!raw) return DEFAULT_SECTIONS;
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed) && parsed.length > 0) {
          return parsed;
        }
      } catch (e) {
        console.warn('Could not load sections', e);
      }
      return DEFAULT_SECTIONS;
    }

    function exportBackup() {
      const data = {
        sections: sections,
        sites: sites
      };
      const jsonStr = JSON.stringify(data, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'data.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function importBackup(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (Array.isArray(parsed.sections) && Array.isArray(parsed.sites)) {
            sections = parsed.sections;
            sites = parsed.sites;
            saveSections();
            saveSites();
            linksContainer.innerHTML = '';
            sites.forEach(createSiteButton);
            updateSectionDropdown();
            renderSectionsList();
            alert('Backup successfully imported!');
          } else {
            alert('Invalid backup file structure. Expected { sections: [...], sites: [...] }');
          }
        } catch (err) {
          alert('Failed to parse backup JSON file: ' + err.message);
        }
      };
      reader.readAsText(file);
    }

      siteSectionSelect.innerHTML = '<option value="">Select or create section...</option>';
      sections.forEach((section) => {

        siteSectionSelect.appendChild(option);

    function renderSectionsList() {
      const container = document.getElementById('sections-list-container');
      if (!container) return;
      
      container.innerHTML = '';
      
      if (sections.length === 0) {
        const emptyMsg = document.createElement('div');
        emptyMsg.style.color = '#6b7280';
        emptyMsg.style.fontSize = '0.85rem';
        emptyMsg.textContent = 'No sections yet. Create one above.';
        container.appendChild(emptyMsg);
        return;
      }
      
      sections.forEach((section) => {
        const item = document.createElement('div');
        item.className = 'section-list-item';
        
        const name = document.createElement('div');
        name.className = 'section-list-item-name';
        name.textContent = section.name;
        
        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'section-list-delete-btn';
        deleteBtn.type = 'button';
        deleteBtn.textContent = '×';
        deleteBtn.title = 'Delete section';
        deleteBtn.addEventListener('click', () => {
          deleteSection(section.id);
        });
        
        item.appendChild(name);
        item.appendChild(deleteBtn);
        container.appendChild(item);
      });

    function getOrCreateSection(sectionId) {
      if (!sectionId) {
        // Create default section if none exists
        if (sections.length === 0) {
          const defaultSection = {
            id: 'default-' + Date.now(),
            name: 'Default',
            order: 0,
          };
          sections.push(defaultSection);
          saveSections();
          return defaultSection;
        }
        return sections[0];
      }
      return sections.find((s) => s.id === sectionId) || sections[0];
    }

    function getSectionElement(sectionId) {
      const sectionEl = document.querySelector(`.section[data-section-id="${sectionId}"]`);
      if (sectionEl) {
        // Ensure drag handlers are set up
        if (!sectionEl.hasAttribute('data-drag-setup')) {
          const titleEl = sectionEl.querySelector('.section-title');
          if (titleEl) {
            setupSectionDragHandlers(sectionEl, titleEl, sectionId);
            sectionEl.setAttribute('data-drag-setup', 'true');
          }
        }
        return sectionEl;
      }
      
      // Create section element if it doesn't exist
      const section = getOrCreateSection(sectionId);
      const newSectionEl = document.createElement('div');
      newSectionEl.className = 'section';
      newSectionEl.dataset.sectionId = section.id;
      
      const titleEl = document.createElement('div');
      titleEl.className = 'section-title';
      titleEl.textContent = section.name;
      
      const buttonsEl = document.createElement('div');
      buttonsEl.className = 'section-buttons';
      
      newSectionEl.appendChild(titleEl);
      newSectionEl.appendChild(buttonsEl);
      
      // Add drag handlers for section reordering (on title to avoid button conflicts)
      setupSectionDragHandlers(newSectionEl, titleEl, section.id);
      newSectionEl.setAttribute('data-drag-setup', 'true');
      
      // Insert in order
      const allSections = Array.from(linksContainer.querySelectorAll('.section'));
      let inserted = false;
      for (let i = 0; i < sections.length; i++) {
        const s = sections[i];
        if (s.id === section.id) {
          if (i === 0) {
            linksContainer.insertBefore(newSectionEl, linksContainer.firstChild);
          } else {
            const prevSection = allSections.find((el) => el.dataset.sectionId === sections[i - 1].id);
            if (prevSection) {
              prevSection.parentNode.insertBefore(newSectionEl, prevSection.nextSibling);
            } else {
              linksContainer.appendChild(newSectionEl);
            }
          }
          inserted = true;
          break;
        }
      }
      if (!inserted) {
        linksContainer.appendChild(newSectionEl);
      }
      
      return newSectionEl;
    }

    function setupSectionDragHandlers(sectionEl, titleEl, sectionId) {
      // Attach drag handlers to title, but move the entire section
      titleEl.addEventListener('dragstart', (e) => {
        if (!reorderMode) {
          e.preventDefault();
          return;
        }
        e.stopPropagation();
        dragSectionId = sectionId;
        sectionEl.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });

      titleEl.addEventListener('dragend', (e) => {
        e.stopPropagation();
        sectionEl.classList.remove('dragging');
        dragSectionId = null;
        // Remove drag-over class from all sections
        linksContainer.querySelectorAll('.section').forEach((s) => {
          s.classList.remove('drag-over');
        });
      });

      // Handle dragover on the section element (for drop target)
      sectionEl.addEventListener('dragover', (e) => {
        if (!reorderMode || dragSectionId === null || dragSectionId === sectionId) return;
        // Don't handle if dragging from within this section's buttons
        if (e.target.closest('.section-buttons')) return;
        e.preventDefault();
        e.stopPropagation();
        e.dataTransfer.dropEffect = 'move';
        
        // Remove drag-over from all sections
        linksContainer.querySelectorAll('.section').forEach((s) => {
          s.classList.remove('drag-over');
        });
        
        // Add drag-over to current section
        sectionEl.classList.add('drag-over');
      });

      sectionEl.addEventListener('drop', (e) => {
        if (!reorderMode || dragSectionId === null || dragSectionId === sectionId) return;
        // Don't handle if dropping on buttons
        if (e.target.closest('.section-buttons')) return;
        e.preventDefault();
        e.stopPropagation();
        
        const draggedSection = linksContainer.querySelector(`.section[data-section-id="${dragSectionId}"]`);
        if (draggedSection && draggedSection !== sectionEl) {
          // Reorder in DOM - this moves the entire section with all its buttons
          linksContainer.insertBefore(draggedSection, sectionEl);
          
          // Update sections array order
          updateSectionsOrderFromDom();
        }
        
        sectionEl.classList.remove('drag-over');
      });
    }

    function updateSectionsOrderFromDom() {
      const orderedIds = Array.from(linksContainer.querySelectorAll('.section')).map(
        (sectionEl) => sectionEl.dataset.sectionId
      );
      
      const map = new Map(sections.map((s) => [s.id, s]));
      const reordered = [];
      orderedIds.forEach((id) => {
        const section = map.get(id);
        if (section) {
          section.order = reordered.length;
          reordered.push(section);
        }
      });
      
      sections = reordered;
      saveSections();
    }

    function deleteSection(sectionId) {
      if (sections.length <= 1) {
        alert('Cannot delete the last section. Create another section first.');
        return;
      }
      
      if (!confirm('Delete this section? Buttons in this section will be moved to the default section.')) {
        return;
      }
      
      // Find default section or first available section
      const defaultSection = sections.find(s => s.name === 'Default') || sections.find(s => s.id !== sectionId);
      if (!defaultSection) return;
      
      // Move all buttons from deleted section to default section
      sites.forEach(site => {
        if (site.sectionId === sectionId) {
          site.sectionId = defaultSection.id;
        }
      });
      
      // Remove section from array
      const sectionIndex = sections.findIndex(s => s.id === sectionId);
      if (sectionIndex !== -1) {
        sections.splice(sectionIndex, 1);
        saveSections();
      }
      
      // Remove section element from DOM
      const sectionEl = document.querySelector(`.section[data-section-id="${sectionId}"]`);
      if (sectionEl) {
        const buttons = Array.from(sectionEl.querySelectorAll('.link-button'));
        buttons.forEach(btn => {
          btn.remove();
        });
        sectionEl.remove();
      }
      
      // Re-render all buttons in their new sections
      linksContainer.innerHTML = '';
      sites.forEach(createSiteButton);
      
      // Update dropdown and sections list
      updateSectionDropdown();
      renderSectionsList();
      
      saveSites();
    }

    function updateSitesOrderFromDom() {
      const reordered = [];
      const sectionsEls = Array.from(linksContainer.querySelectorAll('.section'));
      
      sectionsEls.forEach((sectionEl) => {
        const sectionId = sectionEl.dataset.sectionId;
        const buttons = Array.from(sectionEl.querySelectorAll('.section-buttons button[data-id]'));
        buttons.forEach((btn) => {
          const site = sites.find((s) => s.id === btn.dataset.id);
          if (site) {
            site.sectionId = sectionId;
            reordered.push(site);
          }
        });
      });
      
      sites = reordered;
      saveSites();
    }

    function createSiteButton(site) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.dataset.id = site.id;
      btn.classList.add('link-button');

      const icon = document.createElement('img');
      icon.className = 'link-icon';
      icon.src = site.faviconUrl;
      icon.alt = '';

      const label = document.createElement('span');
      label.textContent = site.name;

      btn.appendChild(icon);
      btn.appendChild(label);

      btn.addEventListener('dragstart', (e) => {
        if (!reorderMode) {
          e.preventDefault();
          return;
        }
        dragSourceId = site.id;
        btn.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });

      btn.addEventListener('dragend', () => {
        btn.classList.remove('dragging');
        dragSourceId = null;
      });

      btn.addEventListener('dragover', (e) => {
        if (!reorderMode || dragSourceId === null || dragSourceId === site.id) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
      });

      btn.addEventListener('drop', (e) => {
        if (!reorderMode || dragSourceId === null || dragSourceId === site.id) return;
        e.preventDefault();
        const dragged = linksContainer.querySelector(`button[data-id="${dragSourceId}"]`);
        if (dragged && dragged !== btn) {
          const buttonsContainer = btn.closest('.section-buttons');
          if (buttonsContainer) {
            buttonsContainer.insertBefore(dragged, btn);
            updateSitesOrderFromDom();
          }
        }
      });

      btn.addEventListener('click', () => {
        if (deleteMode) {
          const idx = sites.findIndex((s) => s.id === site.id);
          if (idx !== -1) {
            sites.splice(idx, 1);
            saveSites();
          }
          btn.remove();
          // Remove section if empty
          const sectionEl = btn.closest('.section');
          if (sectionEl) {
            const buttonsContainer = sectionEl.querySelector('.section-buttons');
            if (buttonsContainer && buttonsContainer.children.length === 0) {
              sectionEl.remove();
            }
          }
        } else if (reorderMode) {
          // Reorder mode: prompt for index
          const buttonsContainer = btn.closest('.section-buttons');
          if (!buttonsContainer) return;
          
          const allButtons = Array.from(buttonsContainer.querySelectorAll('.link-button'));
          const maxIndex = allButtons.length - 1;
          
          const indexInput = prompt(
            `Enter position (0-${maxIndex}) to move "${site.name}" to:\n\nCurrent position: ${allButtons.indexOf(btn)}`,
            allButtons.indexOf(btn).toString()
          );
          
          if (indexInput === null) return; // User cancelled
          
          const targetIndex = parseInt(indexInput, 10);
          if (isNaN(targetIndex) || targetIndex < 0 || targetIndex > maxIndex) {
            alert(`Please enter a valid number between 0 and ${maxIndex}`);
            return;
          }
          
          const currentIndex = allButtons.indexOf(btn);
          if (currentIndex === targetIndex) return; // Already at target position
          
          // Remove button from current position
          btn.remove();
          
          // Insert at target position
          if (targetIndex === 0) {
            buttonsContainer.insertBefore(btn, buttonsContainer.firstChild);
          } else if (targetIndex >= allButtons.length - 1) {
            buttonsContainer.appendChild(btn);
          } else {
            const targetButton = allButtons[targetIndex];
            buttonsContainer.insertBefore(btn, targetButton);
          }
          
          // Update order
          updateSitesOrderFromDom();
        } else {
          window.open(site.url, '_blank');
        }
      });

      const sectionId = site.sectionId || (sections.length > 0 ? sections[0].id : null);
      const sectionEl = getSectionElement(sectionId);
      const buttonsContainer = sectionEl.querySelector('.section-buttons');
      buttonsContainer.appendChild(btn);
    }

    const deleteModeText = document.getElementById('delete-mode-text');
    const reorderModeText = document.getElementById('reorder-mode-text');

    deleteModeBtn.addEventListener('click', () => {
      deleteMode = !deleteMode;
      if (deleteMode) {
        deleteModeBtn.classList.add('active');
        deleteModeText.textContent = 'Remove: On';
      } else {
        deleteModeBtn.classList.remove('active');
        deleteModeText.textContent = 'Remove: Off';
      }
    });

    reorderModeBtn.addEventListener('click', () => {
      reorderMode = !reorderMode;
      if (reorderMode) {
        reorderModeBtn.classList.add('active');
        reorderModeText.textContent = 'Reorder: On';
        // Enable button reordering (click to reorder by index)
        linksContainer.querySelectorAll('.link-button').forEach((btn) => {
          btn.classList.add('reordering');
          // Don't set draggable - we use click to reorder by index
        });
        // Enable section reordering (on title)
        linksContainer.querySelectorAll('.section').forEach((sectionEl) => {
          sectionEl.classList.add('reordering');
          const titleEl = sectionEl.querySelector('.section-title');
          if (titleEl) {
            titleEl.setAttribute('draggable', 'true');
          }
        });
      } else {
        reorderModeBtn.classList.remove('active');
        reorderModeText.textContent = 'Reorder: Off';
        // Disable button reordering
        linksContainer.querySelectorAll('.link-button').forEach((btn) => {
          btn.classList.remove('reordering');
        });
        // Disable section reordering (on title)
        linksContainer.querySelectorAll('.section').forEach((sectionEl) => {
          sectionEl.classList.remove('reordering');
          sectionEl.classList.remove('drag-over');
          const titleEl = sectionEl.querySelector('.section-title');
          if (titleEl) {
            titleEl.setAttribute('draggable', 'false');
          }
        });
        updateSitesOrderFromDom();
        updateSectionsOrderFromDom();
      }
    });

    newSectionBtn.addEventListener('click', () => {

      if (sectionNewInput.classList.contains('show')) {
        sectionNewInput.focus();

      }
    });

    sectionNewInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        const name = sectionNewInput.value.trim();
        if (name) {
          const newSection = {
            id: 'section-' + Date.now() + Math.random().toString(16).slice(2),
            name: name,
            order: sections.length,
          };
          sections.push(newSection);
          saveSections();
          updateSectionDropdown();
          renderSectionsList();
          siteSectionSelect.value = newSection.id;
          sectionNewInput.value = '';
          sectionNewInput.classList.remove('show');

      }
    });

    createSiteBtn.addEventListener('click', () => {
      const domain = siteDomainInput.value.trim();

      if (!domain) {
        alert('Please enter the domain.');
        return;
      }

      let url = domain;
      if (!/^https?:\/\//i.test(url)) {
        url = 'https://' + url;
      }

      // Derive domain for favicon (strip protocol and path)
      const domainOnly = domain.replace(/^https?:\/\//i, '').split('/')[0];

      // Derive a readable name from the domain
      let base = domainOnly.toLowerCase();
      if (base.startsWith('www.')) {
        base = base.slice(4);
      }
      const firstPart = base.split('.')[0] || base;
      const name = firstPart.charAt(0).toUpperCase() + firstPart.slice(1);
      const faviconUrl =
        'https://www.google.com/s2/favicons?domain=' +
        encodeURIComponent(domainOnly) +
        '&sz=32';

      // Get selected section or create default
      let sectionId = siteSectionSelect.value;
      if (!sectionId && sections.length === 0) {
        // Create default section if none exists
        const defaultSection = {
          id: 'default-' + Date.now(),
          name: 'Default',
          order: 0,
        };
        sections.push(defaultSection);
        saveSections();
        sectionId = defaultSection.id;
      } else if (!sectionId) {
        sectionId = sections[0].id;
      }

      const site = {
        id: Date.now().toString() + Math.random().toString(16).slice(2),
        name,
        domain,
        url,
        faviconUrl,
        sectionId: sectionId || null,
      };

      sites.push(site);
      saveSites();
      createSiteButton(site);
      closePanel();
    });

    // Load saved data on page load
    sections = loadSections();
    sites = loadSites();
    
    // Sort sections by order
    sections.sort((a, b) => (a.order || 0) - (b.order || 0));
    
    // Create default section if none exists and we have sites
    if (sections.length === 0 && sites.length > 0) {
      const defaultSection = {
        id: 'default-' + Date.now(),
        name: 'Default',
        order: 0,
      };
      sections.push(defaultSection);
      saveSections();
    }
  


    // Render all buttons in their sections
    sites.forEach(createSiteButton);


// -------------------- NEW: Reorder Section Panel --------------------
const reorderSectionBtn = document.getElementById('reorder-section-btn');
const reorderPanel = document.getElementById('reorder-section-panel');
const reorderSectionSelect = document.getElementById('reorder-section-select');
const reorderSectionIndex = document.getElementById('reorder-section-index');
const cancelReorderSectionBtn = document.getElementById('cancel-reorder-section-btn');
const applyReorderSectionBtn = document.getElementById('apply-reorder-section-btn');

// Open panel
reorderSectionBtn.addEventListener('click', () => {
  reorderSectionSelect.innerHTML = '<option value="">Select a section...</option>';
  sections.forEach((s, idx) => {
    const opt = document.createElement('option');
    opt.value = s.id;
    opt.textContent = `${s.name} (current: ${idx})`;
    reorderSectionSelect.appendChild(opt);
  });

  reorderSectionIndex.value = '';
  reorderPanel.style.display = 'flex';
});

// Close panel
cancelReorderSectionBtn.addEventListener('click', () => {
  reorderPanel.style.display = 'none';
});

// Apply reorder
applyReorderSectionBtn.addEventListener('click', () => {
  const sectionId = reorderSectionSelect.value;
  const newIndex = parseInt(reorderSectionIndex.value, 10);

  if (!sectionId) {
    alert('Please select a section.');
    return;
  }

  if (isNaN(newIndex) || newIndex < 0 || newIndex >= sections.length) {
    alert(`Please enter a valid position between 0 and ${sections.length - 1}`);
    return;
  }

  // Find current index
  const currentIndex = sections.findIndex(s => s.id === sectionId);
  if (currentIndex === -1) return;

  // Remove section from array
  const [section] = sections.splice(currentIndex, 1);

  // Insert at new index
  sections.splice(newIndex, 0, section);

  // Update order properties
  sections.forEach((s, idx) => s.order = idx);

  saveSections();

  // Re-render sections and buttons
  linksContainer.innerHTML = '';
  sites.forEach(createSiteButton);

  reorderPanel.style.display = 'none';
});

// -------------------- Backup & Restore Handlers --------------------
if (exportBackupBtn) exportBackupBtn.addEventListener('click', exportBackup);
if (quickExportBtn) quickExportBtn.addEventListener('click', exportBackup);

if (importBackupBtn) {
  importBackupBtn.addEventListener('click', () => {
    if (importFileInput) importFileInput.click();
  });
}
if (quickImportBtn) {
  quickImportBtn.addEventListener('click', () => {
    if (importFileInput) importFileInput.click();
  });
}

if (importFileInput) {
  importFileInput.addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if (file) {
      importBackup(file);
      importFileInput.value = '';
    }
  });
}

// -------------------- File Auto-Save Handlers --------------------
if (linkFileBtn) linkFileBtn.addEventListener('click', onLinkButtonClick);
if (panelLinkFileBtn) panelLinkFileBtn.addEventListener('click', onLinkButtonClick);

// On startup: check for saved fileHandle and restore auto-saving
(async function initLinkedFile() {
  try {
    const savedHandle = await getStoredFileHandle();
    if (savedHandle) {
      fileHandle = savedHandle;
      const perm = await fileHandle.queryPermission({ mode: 'readwrite' });
      updateFileLinkUI(perm === 'granted');
    } else {
      updateFileLinkUI(false);
    }
  } catch (e) {
    updateFileLinkUI(false);
  }
})();
    
  </script>
